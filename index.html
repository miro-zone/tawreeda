                  ? `<div class="mt-2 px-3 py-1.5 rounded-xl bg-amber-50/70 border border-amber-200 text-amber-800 text-[11px] font-bold flex items-center justify-between">
                      <span>فاضلك ${toNextBonus} كرتونة وتاخد ${p.bonusFree} كرتونة هدية 🎁</span>
                      <button type="button" data-quick-add="${toNextBonus}" data-pid="${p.id}" data-unit="carton" class="underline font-extrabold text-amber-900 mr-2">كمّل العرض</button>
                    </div>`
                  : ''
              }

              <div class="mt-auto pt-3">
                ${
                  !p.inStock
                    ? `<button type="button" disabled class="w-full min-h-[46px] rounded-xl bg-slate-200 text-slate-500 font-extrabold text-sm cursor-not-allowed">
                        خلصان حالاً - غير متاح للطلب
                      </button>`
                    : activeQty === 0
                    ? `<div class="flex items-center gap-2">
                        <button
                          type="button"
                          data-qty-delta="1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          class="flex-1 min-h-[46px] px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition-all"
                        >
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                          <span>أضف ${selectedMode === 'carton' ? 'كرتونة' : 'شرنك'} (${formatMoney(currentPrice)} ج)</span>
                        </button>
                        ${
                          selectedMode === 'carton' && p.bonusBuy > 0
                            ? `<button
                                type="button"
                                data-quick-add="${p.bonusBuy}"
                                data-pid="${p.id}"
                                data-unit="carton"
                                title="إضافة ${p.bonusBuy} كراتين للاستفادة من العرض"
                                class="min-h-[46px] px-3 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-extrabold text-xs whitespace-nowrap transition-colors"
                              >+${p.bonusBuy} للعرض</button>`
                            : ''
                        }
                      </div>`
                    : `<div class="flex items-center justify-between gap-2 bg-slate-50 p-1 rounded-xl border border-emerald-300">
                        <button
                          type="button"
                          data-qty-delta="1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          aria-label="زيادة الكمية"
                          class="w-12 h-[44px] rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-xl flex items-center justify-center transition-all"
                        >+</button>
                        <div class="text-center flex-1">
                          <div class="text-base font-black text-slate-900 tabular-nums leading-tight">${activeQty} <span class="text-xs font-bold text-slate-600">${selectedMode === 'carton' ? 'كرتونة' : 'شرنك'}</span></div>
                          <div class="text-[11px] font-bold text-emerald-700 tabular-nums">${formatMoney(activeQty * currentPrice)} ج</div>
                        </div>
                        <button
                          type="button"
                          data-qty-delta="-1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          aria-label="تقليل الكمية"
                          class="w-12 h-[44px] rounded-lg bg-white hover:bg-red-50 active:scale-95 text-slate-800 hover:text-red-600 border border-slate-300 font-black text-xl flex items-center justify-center transition-all"
                        >−</button>
                      </div>`
                }
              </div>
            </div>
          </article>
        `;
      }

      // =========================================================================
      // VIEW 2: MERCHANT DASHBOARD
      // =========================================================================
      function renderMerchantView() {
        const newOrdersCount = state.orders.filter((o) => o.status === 'new').length;
        const approvedOrdersCount = state.orders.filter((o) => o.status === 'approved').length;
        const badgeCount = newOrdersCount + approvedOrdersCount;

        return `
          <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-2 mb-3.5 no-print">
            <div class="grid grid-cols-2 gap-1.5">
              <button
                id="merchant-tab-inventory"
                type="button"
                class="min-h-[48px] px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 transition-all ${
                  state.merchantTab === 'inventory'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'bg-slate-50 text-slate-700 hover:bg-slate-100'
                }"
              >
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
                </svg>
                <span>إدارة الأسعار والمخزون</span>
              </button>

              <button
                id="merchant-tab-orders"
                type="button"
                class="min-h-[48px] px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 transition-all ${
                  state.merchantTab === 'orders'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'bg-slate-50 text-slate-700 hover:bg-slate-100'
                }"
              >
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z" />
                </svg>
                <span>أوردرات اليوم وعهدة السواق</span>
                ${
                  badgeCount > 0
                    ? `<span class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 text-xs font-black rounded-full ${
                        state.merchantTab === 'orders' ? 'bg-amber-400 text-slate-950' : 'bg-red-500 text-white'
                      } tabular-nums">${badgeCount}</span>`
                    : ''
                }
              </button>
            </div>
          </section>

          ${state.merchantTab === 'inventory' ? renderMerchantInventoryTab() : renderMerchantOrdersTab()}
        `;
      }

      // ---- Merchant Tab 1: Inventory + Bulk Price Update + CSV ----
      function renderBulkPricePanel() {
        const categories = getAllCategories();
        const brands = getAllBrands();

        if (state.bulkScopeType === 'category' && !categories.includes(state.bulkScopeValue)) {
          state.bulkScopeValue = categories[0] || '';
        }
        if (state.bulkScopeType === 'brand' && !brands.includes(state.bulkScopeValue)) {
          state.bulkScopeValue = brands[0] || '';
        }

        const previewText = getBulkPreviewText();

        return `
          <section class="bg-white rounded-2xl border border-slate-200 shadow-sm mb-3.5 overflow-hidden">
            <button
              id="btn-toggle-bulk-panel"
              type="button"
              class="w-full px-4 py-3 flex items-center justify-between gap-2 bg-slate-50 hover:bg-slate-100/80 transition-colors text-right"
            >
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center text-sm font-black flex-shrink-0">⚡</span>
                <div>
                  <h2 class="text-sm font-black text-slate-900">تعديل جماعي سريع للأسعار</h2>
                  <p class="text-[11px] font-semibold text-slate-500">ارفع أو خصم أسعار شركة كاملة أو فئة بضغطة واحدة مع إمكانية التراجع</p>
                </div>
              </div>
              <span class="text-xs font-extrabold text-slate-600 bg-white border border-slate-200 px-2.5 py-1 rounded-lg flex-shrink-0">
                ${state.bulkPanelOpen ? 'إخفاء ▲' : 'فتح ▼'}
              </span>
            </button>

            ${
              state.bulkPanelOpen
                ? `<div class="p-3.5 sm:p-4 border-t border-slate-200 space-y-3 animate-fade-in">
                    <!-- Scope Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="bulk-scope-type">نطاق التعديل</label>
                        <select id="bulk-scope-type" class="w-full min-h-[44px] px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-emerald-500 outline-none text-xs sm:text-sm font-extrabold text-slate-900">
                          <option value="brand" ${state.bulkScopeType === 'brand' ? 'selected' : ''}>شركة مورّدة محددة</option>
                          <option value="category" ${state.bulkScopeType === 'category' ? 'selected' : ''}>فئة محددة</option>
                          <option value="all" ${state.bulkScopeType === 'all' ? 'selected' : ''}>كل الأصناف في الكتالوج</option>
                        </select>
                      </div>

                      ${
                        state.bulkScopeType === 'all'
                          ? `<div class="flex items-end">
                              <div class="w-full min-h-[44px] px-3 py-2 rounded-xl bg-slate-100 border border-slate-200 flex items-center text-xs font-bold text-slate-600">
                                يشمل جميع الأصناف (${state.products.length} صنف)
                              </div>
                            </div>`
                          : `<div>
                              <label class="block text-xs font-bold text-slate-600 mb-1" for="bulk-scope-value">
                                ${state.bulkScopeType === 'brand' ? 'اختر الشركة المورّدة' : 'اختر الفئة'}
                              </label>
                              <select id="bulk-scope-value" class="w-full min-h-[44px] px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-emerald-500 outline-none text-xs sm:text-sm font-extrabold text-slate-900">
                                ${(state.bulkScopeType === 'brand' ? brands : categories)
                                  .map(
                                    (opt) =>
                                      `<option value="${escapeHtml(opt)}" ${state.bulkScopeValue === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`
                                  )
                                  .join('')}
                              </select>
                            </div>`
                      }
                    </div>

                    <!-- Operation, Value & Unit Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                      <!-- Increase / Decrease -->
                      <div class="sm:col-span-4 grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl border border-slate-200">
                        <button
                          type="button"
                          data-bulk-op="increase"
                          class="min-h-[40px] rounded-lg text-xs font-extrabold transition-all ${
                            state.bulkOperation === 'increase'
                              ? 'bg-emerald-600 text-white shadow-sm'
                              : 'text-slate-700 hover:bg-white'
                          }"
                        >زيادة (+)</button>
                        <button
                          type="button"
                          data-bulk-op="decrease"
                          class="min-h-[40px] rounded-lg text-xs font-extrabold transition-all ${
                            state.bulkOperation === 'decrease'
                              ? 'bg-red-600 text-white shadow-sm'
                              : 'text-slate-700 hover:bg-white'
                          }"
                        >خصم (-)</button>
                      </div>

                      <!-- Numeric Value -->
                      <div class="sm:col-span-4">
                        <input
                          id="bulk-value-input"
                          type="number"
                          inputmode="decimal"
                          min="0.1"
                          step="any"
                          value="${escapeHtml(state.bulkValue)}"
                          placeholder="أدخل القيمة..."
                          class="w-full min-h-[48px] px-3.5 py-2 rounded-xl border-2 border-slate-200 focus:border-emerald-500 bg-slate-50 focus:bg-white outline-none text-base font-black text-slate-900 tabular-nums"
                        />
                      </div>

                      <!-- Percent / Fixed -->
                      <div class="sm:col-span-4 grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl border border-slate-200">
                        <button
                          type="button"
                          data-bulk-unit="percent"
                          class="min-h-[40px] rounded-lg text-xs font-extrabold transition-all ${
                            state.bulkUnit === 'percent'
                              ? 'bg-slate-900 text-white shadow-sm'
                              : 'text-slate-700 hover:bg-white'
                          }"
                        >نسبة (%)</button>
                        <button
                          type="button"
                          data-bulk-unit="fixed"
                          class="min-h-[40px] rounded-lg text-xs font-extrabold transition-all ${
                            state.bulkUnit === 'fixed'
                              ? 'bg-slate-900 text-white shadow-sm'
                              : 'text-slate-700 hover:bg-white'
                          }"
                        >مبلغ (جنيه)</button>
                      </div>
                    </div>

                    <!-- Live Preview & Apply Button -->
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 bg-amber-50/80 border border-amber-200 rounded-xl p-3">
                      <div class="flex items-center gap-2 text-xs sm:text-sm font-extrabold text-amber-950">
                        <span>👁️</span>
                        <span id="bulk-preview-text">${escapeHtml(previewText)}</span>
                      </div>
                      <button
                        id="btn-apply-bulk"
                        type="button"
                        class="min-h-[44px] px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold whitespace-nowrap shadow-sm transition-all flex-shrink-0"
                      >تطبيق على الكتالوج</button>
                    </div>
                  </div>`
                : ''
            }
          </section>
        `;
      }

      function renderMerchantInventoryTab() {
        const total = state.products.length;
        const available = state.products.filter((p) => p.inStock).length;
        const outOfStock = total - available;
        const clearance = state.products.filter((p) => p.isClearance && p.inStock).length;

        const q = state.merchantSearchQuery.trim().toLowerCase();
        const filtered = state.products.filter((p) => {
          if (!q) return true;
          return `${p.name} ${p.category} ${p.brand || ''}`.toLowerCase().includes(q);
        });

        return `
          <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 sm:p-4 mb-3.5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div>
                <h1 class="text-base sm:text-lg font-black text-slate-900">تحديث الأسعار والمخزون لحظياً</h1>
                <p class="text-xs text-slate-500 mt-0.5">عدّل أي سعر مباشرة أو فعّل "خلصان / حرق سعر" لينعكس فوراً عند السوبر ماركت</p>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button
                  id="btn-open-csv-modal"
                  type="button"
                  class="min-h-[44px] px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-300 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition-all"
                >
                  <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
                  <span>استيراد / تصدير إكسل (CSV)</span>
                </button>
                <button
                  id="btn-open-add-product"
                  type="button"
                  class="min-h-[44px] px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold flex items-center gap-1.5 shadow-sm transition-all"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                  <span>إضافة صنف جديد</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-emerald-700 tabular-nums">${available}</div>
                <div class="text-[11px] font-bold text-emerald-900">صنف متاح</div>
              </div>
              <div class="bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-slate-700 tabular-nums">${outOfStock}</div>
                <div class="text-[11px] font-bold text-slate-600">خلصان</div>
              </div>
              <div class="bg-orange-50 border border-orange-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-orange-700 tabular-nums">${clearance}</div>
                <div class="text-[11px] font-bold text-orange-900">حرق أسعار</div>
              </div>
            </div>

            <div class="relative">
              <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
              </div>
              <input
                id="merchant-search-input"
                type="search"
                value="${escapeHtml(state.merchantSearchQuery)}"
                placeholder="فلترة الأصناف أو الشركات للتعديل السريع..."
                class="w-full min-h-[44px] pr-10 pl-4 py-2 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white outline-none text-sm font-semibold text-slate-900"
              />
            </div>
          </section>

          ${renderBulkPricePanel()}

          <section class="space-y-3">
            ${filtered.map(renderMerchantProductRow).join('')}
          </section>
        `;
      }

      function renderMerchantProductRow(p) {
        const pending = state.pendingPriceEdits[p.id] || {};
        const cartonVal = pending.cartonPrice !== undefined ? pending.cartonPrice : p.cartonPrice;
        const packetVal =
          pending.packetPrice !== undefined
            ? pending.packetPrice
            : p.packetPrice != null
            ? p.packetPrice
            : '';

        const isDirty = pending.cartonPrice !== undefined || pending.packetPrice !== undefined;
        const liveUnitCost =
          p.unitsPerCarton && Number(cartonVal) > 0
            ? +(Number(cartonVal) / p.unitsPerCarton).toFixed(2)
            : p.unitCost;

        return `
          <div class="bg-white rounded-2xl border ${
            isDirty
              ? 'border-amber-400 ring-2 ring-amber-200/60'
              : p.isClearance
              ? 'border-orange-300'
              : !p.inStock
              ? 'border-slate-200 bg-slate-50/70'
              : 'border-slate-200'
          } shadow-sm p-3.5 sm:p-4 transition-all" data-merchant-row="${p.id}">
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">${escapeHtml(p.category)}</span>
                  ${p.brand ? `<span class="text-[11px] font-bold text-sky-800 bg-sky-50 border border-sky-200 px-2 py-0.5 rounded-md">🏢 ${escapeHtml(p.brand)}</span>` : ''}
                  ${!p.inStock ? `<span class="text-[11px] font-extrabold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md">خلصان</span>` : ''}
                  ${p.isClearance ? `<span class="text-[11px] font-extrabold bg-orange-100 text-red-700 px-2 py-0.5 rounded-md">🔥 حرق سعر - مثبت بالأعلى</span>` : ''}
                  ${p.promoText && !p.isClearance ? `<span class="text-[11px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md">🎁 ${escapeHtml(p.promoText)}</span>` : ''}
                </div>
                <h2 class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug">${escapeHtml(p.name)}</h2>
              </div>
              <div class="text-left flex-shrink-0">
                <span class="text-[11px] text-slate-500 block">سعر القطعة</span>
                <span id="live-unit-cost-${p.id}" class="text-sm font-black text-emerald-700 tabular-nums">${formatMoney(liveUnitCost)} ج</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5 mb-3">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" for="price-carton-${p.id}">سعر الكرتونة (ج)</label>
                <div class="relative">
                  <input
                    id="price-carton-${p.id}"
                    type="number"
                    inputmode="decimal"
                    min="1"
                    step="any"
                    value="${escapeHtml(cartonVal)}"
                    data-price-input="carton"
                    data-pid="${p.id}"
                    class="w-full min-h-[44px] px-3 py-2 rounded-xl border-2 ${
                      pending.cartonPrice !== undefined
                        ? 'border-amber-400 bg-amber-50/40'
                        : 'border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500'
                    } outline-none text-base font-black text-slate-900 tabular-nums transition-colors"
                  />
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">ج</span>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" for="price-packet-${p.id}">سعر الشرنك / الباكت (ج)</label>
                <div class="relative">
                  <input
                    id="price-packet-${p.id}"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    value="${escapeHtml(packetVal)}"
                    placeholder="كرتونة فقط"
                    data-price-input="packet"
                    data-pid="${p.id}"
                    class="w-full min-h-[44px] px-3 py-2 rounded-xl border-2 ${
                      pending.packetPrice !== undefined
                        ? 'border-amber-400 bg-amber-50/40'
                        : 'border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500'
                    } outline-none text-base font-black text-slate-900 placeholder:text-xs placeholder:font-semibold placeholder:text-slate-400 tabular-nums transition-colors"
                  />
                  ${packetVal !== '' ? `<span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">ج</span>` : ''}
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2.5 border-t border-slate-100">
              <div class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl px-3 py-2 min-h-[48px]">
                <div>
                  <span class="text-xs font-extrabold ${p.inStock ? 'text-emerald-800' : 'text-slate-600'}">
                    ${p.inStock ? 'متاح في المخزن' : 'خلصان (مخفي الطلب)'}
                  </span>
                  <span class="block text-[10px] text-slate-500">تحديث فوري في الكتالوج</span>
                </div>
                <button
                  type="button"
                  role="switch"
                  aria-checked="${p.inStock}"
                  aria-label="تبديل حالة التوفر"
                  data-toggle-stock="${p.id}"
                  data-checked="${p.inStock}"
                  class="toggle-track ${p.inStock ? 'bg-emerald-500' : 'bg-slate-300'}"
                >
                  <span class="toggle-thumb"></span>
                </button>
              </div>

              <div class="flex items-center justify-between gap-2 ${
                p.isClearance ? 'bg-orange-50 border border-orange-200' : 'bg-slate-50'
              } rounded-xl px-3 py-2 min-h-[48px]">
                <div>
                  <span class="text-xs font-extrabold ${p.isClearance ? 'text-red-700' : 'text-slate-700'}">
                    🔥 حرق سعر - صلاحية قريبة
                  </span>
                  <span class="block text-[10px] ${p.isClearance ? 'text-orange-700' : 'text-slate-500'}">
                    يظهر للعميل كـ "لقطة اليوم - كمية محدودة"
                  </span>
                </div>
                <button
                  type="button"
                  role="switch"
                  aria-checked="${p.isClearance}"
                  aria-label="تبديل وضع حرق السعر"
                  data-toggle-clearance="${p.id}"
                  data-checked="${p.isClearance}"
                  class="toggle-track ${p.isClearance ? 'bg-orange-500' : 'bg-slate-300'}"
                >
                  <span class="toggle-thumb"></span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // ---- Merchant Tab 2: Approval Gate, Truck Loading & Driver Settlement ----
      function getAggregatedPickingList(orders) {
        const map = {};
        orders.forEach((order) => {
          order.items.forEach((item) => {
            const key = item.productId || item.name;
            if (!map[key]) {
              map[key] = {
                key,
                name: item.name,
                cartons: 0,
                packets: 0,
                bonusCartons: 0,
                orderCount: 0,
              };
            }
            map[key].cartons += item.cartons || 0;
            map[key].packets += item.packets || 0;
            map[key].bonusCartons += item.bonusCartons || 0;
            map[key].orderCount += 1;
          });
        });
        return Object.values(map).sort((a, b) => b.cartons + b.bonusCartons - (a.cartons + a.bonusCartons));
      }

      function renderMerchantOrdersTab() {
        const activeOrders = state.orders.filter((o) => o.status !== 'rejected');
        const newOrders = activeOrders.filter((o) => o.status === 'new');
        const approvedOrders = activeOrders.filter((o) => o.status === 'approved');
        const dispatchedOrders = activeOrders.filter((o) => o.status === 'dispatched');
        const settledOrders = activeOrders.filter((o) => o.status === 'settled');
        const outOrSettledCount = dispatchedOrders.length + settledOrders.length;

        const totalSales = activeOrders.reduce((s, o) => s + o.totalAmount, 0);
        const confirmedSales = activeOrders
          .filter((o) => o.status !== 'new')
          .reduce((s, o) => s + o.totalAmount, 0);

        // Driver Cash & Remaining Credit KPIs
        const actualCashCollected = settledOrders.reduce((s, o) => s + (Number(o.actualCashCollected) || 0), 0);
        const settledRemainingCredit = settledOrders.reduce((s, o) => s + (Number(o.remainingCredit) || 0), 0);
        const pendingCreditOrdersTotal = activeOrders
          .filter((o) => o.status !== 'settled' && !o.paymentMethod.includes('كاش'))
          .reduce((s, o) => s + o.totalAmount, 0);
        const totalRemainingCredit = settledRemainingCredit + pendingCreditOrdersTotal;
        const cashShareBase = actualCashCollected + totalRemainingCredit;
        const cashBarPct = cashShareBase > 0 ? Math.round((actualCashCollected / cashShareBase) * 100) : 0;

        // ONLY approved orders populate the Warehouse Truck Loading / Picking List!
        const aggregated = getAggregatedPickingList(approvedOrders);
        const totalLoadCartons = aggregated.reduce((s, i) => s + i.cartons, 0);
        const totalLoadBonus = aggregated.reduce((s, i) => s + i.bonusCartons, 0);
        const totalLoadPackets = aggregated.reduce((s, i) => s + i.packets, 0);
        const checkedCount = aggregated.filter((i) => state.pickingChecked[i.key]).length;

        return `
          <!-- Updated KPI Cards -->
          <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 no-print">
            <!-- KPI 1: Orders Lifecycle Breakdown -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500">حالة أوردرات اليوم</span>
                <span class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/></svg>
                </span>
              </div>
              <div class="text-2xl font-black text-slate-900 mt-1 tabular-nums">${activeOrders.length} <span class="text-sm font-bold text-slate-500">أوردر نشط</span></div>
              <div class="mt-2 flex flex-wrap items-center gap-1.5 text-[11px] font-extrabold">
                <span class="bg-amber-100 text-amber-900 px-2 py-0.5 rounded-md tabular-nums">${newOrders.length} جديد بانتظار الاعتماد</span>
                <span class="bg-sky-100 text-sky-900 px-2 py-0.5 rounded-md tabular-nums">${approvedOrders.length} قيد التحميل</span>
                <span class="bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded-md tabular-nums">${outOrSettledCount} خرج للتوصيل أو مقفل</span>
              </div>
            </div>

            <!-- KPI 2: Total Sales Value -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500">إجمالي المبيعات</span>
                <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z"/></svg>
                </span>
              </div>
              <div class="text-2xl font-black text-emerald-700 mt-1 tabular-nums">${formatMoney(totalSales)} <span class="text-sm font-bold">جنيه</span></div>
              <p class="text-[11px] font-bold text-slate-600 mt-2 tabular-nums">معتمد ومؤكد: ${formatMoney(confirmedSales)} ج</p>
              <p class="text-[11px] font-semibold text-slate-400 tabular-nums">متوسط الأوردر: ${activeOrders.length > 0 ? formatMoney(Math.round(totalSales / activeOrders.length)) : 0} ج</p>
            </div>

            <!-- KPI 3: Driver Cash Custody & Remaining Credit -->
            <div class="bg-white rounded-2xl border-2 border-emerald-200 shadow-sm p-4">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-extrabold text-slate-800">💰 عهدة السواق والتحصيل</span>
                <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full tabular-nums">${settledOrders.length} مقفل</span>
              </div>
              <div class="space-y-1.5">
                <div class="flex items-center justify-between text-xs font-extrabold">
                  <span class="text-emerald-700">💵 كاش في جيب السواق:</span>
                  <span class="text-emerald-800 font-black tabular-nums">${formatMoney(actualCashCollected)} ج</span>
                </div>
                <div class="flex items-center justify-between text-xs font-extrabold">
                  <span class="text-amber-700">📒 الآجل المتبقي عند العملاء:</span>
                  <span class="text-amber-900 font-black tabular-nums">${formatMoney(totalRemainingCredit)} ج</span>
                </div>
                <div class="w-full h-2 bg-amber-200 rounded-full overflow-hidden flex mt-1">
                  <div class="h-full bg-emerald-500 transition-all" style="width: ${cashBarPct}%"></div>
                </div>
                <p class="text-[10px] font-semibold text-slate-500">
                  ${dispatchedOrders.length > 0 ? `بانتظار تقفيل ${dispatchedOrders.length} أوردر مع السواق حالياً` : 'يتم تحديث العهدة فور تقفيل حساب كل أوردر'}
                </p>
              </div>
            </div>
          </section>

          <!-- Aggregated Warehouse Truck Loading Sheet (Approved Orders ONLY) -->
          <section id="print-area" class="bg-white rounded-2xl border-2 border-slate-900 shadow-sm overflow-hidden mb-4">
            <div class="bg-slate-900 text-white p-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="text-base sm:text-lg font-black flex items-center gap-2">
                    <span>🚛</span>
                    <span>ورقة تحميل العربية للمخزن</span>
                  </h2>
                  <p class="text-xs text-slate-300 mt-0.5">تظهر هنا الأوردرات <strong class="text-emerald-300">المعتمدة فقط</strong> (لا تدخل الأوردرات الجديدة قبل موافقتك)</p>
                </div>
                <div class="flex items-center gap-1.5 no-print">
                  <button
                    id="btn-copy-picking"
                    type="button"
                    class="min-h-[40px] px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold flex items-center gap-1.5 transition-colors"
                  >
                    <span>نسخ للمخزن</span>
                  </button>
                  <button
                    id="btn-print-picking"
                    type="button"
                    class="min-h-[40px] px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 text-xs font-bold transition-colors"
                  >طباعة</button>
                </div>
              </div>

              <div class="mt-3 pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs font-bold text-sky-300 bg-sky-500/15 border border-sky-400/30 px-2.5 py-1 rounded-lg tabular-nums">
                  أوردرات معتمدة قيد التحميل: ${approvedOrders.length}
                </span>

                <div class="flex items-center gap-2 text-xs font-extrabold flex-wrap">
                  <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg tabular-nums">📦 ${totalLoadCartons} كرتونة</span>
                  ${totalLoadBonus > 0 ? `<span class="bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2.5 py-1 rounded-lg tabular-nums">🎁 +${totalLoadBonus} هدية</span>` : ''}
                  ${totalLoadPackets > 0 ? `<span class="bg-sky-400/20 text-sky-300 border border-sky-400/30 px-2.5 py-1 rounded-lg tabular-nums">🛍️ ${totalLoadPackets} شرنك</span>` : ''}
                </div>
              </div>
            </div>

            <div class="p-3.5 sm:p-4">
              ${
                aggregated.length === 0
                  ? `<div class="py-7 text-center">
                      <p class="text-sm font-extrabold text-slate-700">لا توجد أوردرات معتمدة قيد التحميل حالياً</p>
                      <p class="text-xs text-slate-500 mt-1">${
                        newOrders.length > 0
                          ? `يوجد ${newOrders.length} أوردر جديد بالأسفل — اضغط "اعتماد وتحويل للمخزن" لإضافته لورقة التحميل`
                          : 'تم تحميل وخروج جميع الأوردرات المعتمدة ✓'
                      }</p>
                    </div>`
                  : `
                    <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-2.5 no-print">
                      <span>علّم على كل صنف بعد تحميله في العربية:</span>
                      <span class="text-emerald-700 tabular-nums">تم تجهيز ${checkedCount} من ${aggregated.length}</span>
                    </div>
                    <ul class="divide-y divide-slate-100">
                      ${aggregated
                        .map((item) => {
                          const isChecked = !!state.pickingChecked[item.key];
                          return `
                            <li class="py-3 first:pt-1 last:pb-1">
                              <label class="flex items-center justify-between gap-3 cursor-pointer select-none">
                                <div class="flex items-center gap-3 min-w-0">
                                  <input
                                    type="checkbox"
                                    data-picking-check="${escapeHtml(item.key)}"
                                    ${isChecked ? 'checked' : ''}
                                    class="w-6 h-6 rounded-lg accent-emerald-600 cursor-pointer flex-shrink-0 no-print"
                                  />
                                  <div class="min-w-0">
                                    <p class="text-sm font-extrabold ${isChecked ? 'line-through text-slate-400' : 'text-slate-900'} leading-snug">
                                      ${escapeHtml(item.name)}
                                    </p>
                                    <p class="text-[11px] font-semibold text-slate-500 mt-0.5">مجمع من ${item.orderCount} ${item.orderCount === 1 ? 'أوردر معتمد' : 'أوردرات معتمدة'}</p>
                                  </div>
                                </div>

                                <div class="flex items-center gap-1.5 flex-wrap justify-end flex-shrink-0">
                                  ${item.cartons > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-black tabular-nums">${item.cartons} كرتونة</span>` : ''}
                                  ${item.bonusCartons > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 border border-amber-300 text-xs font-black tabular-nums">+${item.bonusCartons} هدية 🎁</span>` : ''}
                                  ${item.packets > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-sky-100 text-sky-900 border border-sky-200 text-xs font-black tabular-nums">${item.packets} شرنك</span>` : ''}
                                </div>
                              </label>
                            </li>
                          `;
                        })
                        .join('')}
                    </ul>
                  `
              }
            </div>
          </section>

          <!-- Orders Feed with Approval Gate & Driver Settlement -->
          <section class="no-print">
            <div class="flex items-center justify-between mb-2.5 px-1">
              <h2 class="text-base font-black text-slate-900">إدارة أوردرات العملاء (${state.orders.length})</h2>
              <span class="text-xs font-bold text-slate-500">الأحدث أولاً</span>
            </div>

            ${
              state.orders.length === 0
                ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm font-bold text-slate-500">لا توجد أوردرات مستلمة اليوم بعد</div>`
                : `<div class="space-y-3">
                    ${state.orders.map(renderOrderCard).join('')}
                  </div>`
            }
          </section>
        `;
      }

      function renderOrderCard(order) {
        const isExpanded = !!state.expandedOrders[order.id];
        const isCash = order.paymentMethod.includes('كاش');

        const statusMeta = {
          new: {
            label: '🔔 طلب جديد - بانتظار التأكيد',
            badgeCls: 'bg-amber-100 text-amber-900 border border-amber-300',
            cardBorder: 'border-amber-300 ring-1 ring-amber-200/70',
          },
          approved: {
            label: '📦 معتمد - قيد التحميل',
            badgeCls: 'bg-sky-100 text-sky-900 border border-sky-200',
            cardBorder: 'border-sky-300',
          },
          dispatched: {
            label: '🚚 خرج للتوصيل مع السواق',
            badgeCls: 'bg-cyan-600 text-white',
            cardBorder: 'border-cyan-300',
          },
          settled: {
            label: '✅ تم التسليم والتقفيل',
            badgeCls: 'bg-emerald-600 text-white',
            cardBorder: 'border-emerald-300 bg-emerald-50/20',
          },
          rejected: {
            label: '✕ مرفوض / ملغي',
            badgeCls: 'bg-slate-200 text-slate-600',
            cardBorder: 'border-slate-200 opacity-65',
          },
        };

        const meta = statusMeta[order.status] || statusMeta.new;

        let primaryActionsHtml = '';
        if (order.status === 'new') {
          primaryActionsHtml = `
            <div class="px-3.5 sm:px-4 pb-3 flex items-center gap-2">
              <button
                type="button"
                data-order-action="approve"
                data-oid="${order.id}"
                class="flex-1 min-h-[44px] px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold shadow-sm transition-all"
              >✓ اعتماد وتحويل للمخزن</button>
              <button
                type="button"
                data-order-action="reject"
                data-oid="${order.id}"
                class="min-h-[44px] px-3.5 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-extrabold transition-colors"
              >رفض / إلغاء</button>
            </div>
          `;
        } else if (order.status === 'approved') {
          primaryActionsHtml = `
            <div class="px-3.5 sm:px-4 pb-3 flex items-center gap-2">
              <button
                type="button"
                data-order-action="dispatch"
                data-oid="${order.id}"
                class="flex-1 min-h-[44px] px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold shadow-sm transition-all"
              >🚚 خرج للتوصيل مع السواق</button>
            </div>
          `;
        } else if (order.status === 'dispatched') {
          primaryActionsHtml = `
            <div class="px-3.5 sm:px-4 pb-3 flex items-center gap-2">
              <button
                type="button"
                data-order-action="open-settle"
                data-oid="${order.id}"
                class="flex-1 min-h-[44px] px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold shadow-sm transition-all"
              >💰 تسليم وتقفيل الحساب (عهدة السواق)</button>
            </div>
          `;
        } else if (order.status === 'settled') {
          primaryActionsHtml = `
            <div class="px-3.5 sm:px-4 pb-3">
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-emerald-800 tabular-nums">💵 كاش محصل: ${formatMoney(order.actualCashCollected || 0)} ج</span>
                  <span class="text-slate-300">|</span>
                  <span class="${(order.remainingCredit || 0) > 0 ? 'text-amber-800' : 'text-slate-500'} tabular-nums">📒 متبقي آجل: ${formatMoney(order.remainingCredit || 0)} ج</span>
                </div>
                <button
                  type="button"
                  data-order-action="open-settle"
                  data-oid="${order.id}"
                  class="text-[11px] font-bold text-slate-600 hover:text-slate-900 underline"
                >تعديل التقفيل</button>
              </div>
            </div>
          `;
        } else if (order.status === 'rejected') {
          primaryActionsHtml = `
            <div class="px-3.5 sm:px-4 pb-3 flex items-center justify-end">
              <button
                type="button"
                data-order-action="restore"
                data-oid="${order.id}"
                class="min-h-[38px] px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
              >↩️ استرجاع كطلب جديد</button>
            </div>
          `;
        }

        return `
          <article class="bg-white rounded-2xl border ${meta.cardBorder} shadow-sm overflow-hidden">
            <button
              type="button"
              data-toggle-order="${order.id}"
              class="w-full p-3.5 sm:p-4 text-right flex items-center justify-between gap-3 hover:bg-slate-50/70 transition-colors"
            >
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                  <span class="text-xs font-black text-slate-500 tabular-nums">#${order.number}</span>
                  <span class="text-xs font-bold text-slate-400">• ${escapeHtml(order.createdAt)}</span>
                  <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-full ${
                    isCash ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
                  }">${escapeHtml(order.paymentMethod)}</span>
                  <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${meta.badgeCls}">${meta.label}</span>
                </div>
                <h3 class="text-sm sm:text-base font-black text-slate-900 truncate">${escapeHtml(order.shopName)}</h3>
                <p class="text-xs font-semibold text-slate-500 truncate mt-0.5">📍 ${escapeHtml(order.address)}</p>
              </div>

              <div class="flex items-center gap-2.5 flex-shrink-0">
                <div class="text-left">
                  <div class="text-base sm:text-lg font-black text-slate-900 tabular-nums">${formatMoney(order.totalAmount)} <span class="text-xs font-bold">ج</span></div>
                  <div class="text-[11px] font-bold text-slate-500 tabular-nums">
                    ${order.items.length} أصناف
                    ${order.totalBonusCartons > 0 ? `• +${order.totalBonusCartons} هدية` : ''}
                  </div>
                </div>
                <svg class="w-5 h-5 text-slate-400 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
              </div>
            </button>

            ${primaryActionsHtml}

            ${
              isExpanded
                ? `<div class="px-3.5 sm:px-4 pb-4 pt-2 border-t border-slate-100 bg-slate-50/60 animate-fade-in">
                    <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 mb-3">
                      ${order.items
                        .map(
                          (it) => `
                            <div class="p-2.5 flex items-center justify-between gap-2 text-xs">
                              <div>
                                <div class="font-extrabold text-slate-900">${escapeHtml(it.name)}</div>
                                <div class="text-slate-600 font-semibold mt-0.5 flex items-center gap-2 flex-wrap">
                                  ${it.cartons > 0 ? `<span>${it.cartons} كرتونة × ${formatMoney(it.cartonPrice)} ج</span>` : ''}
                                  ${it.packets > 0 && it.packetPrice != null ? `<span>${it.packets} شرنك × ${formatMoney(it.packetPrice)} ج</span>` : ''}
                                  ${it.bonusCartons > 0 ? `<span class="text-amber-800 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded font-extrabold">🎁 +${it.bonusCartons} كرتونة هدية</span>` : ''}
                                </div>
                              </div>
                              <div class="font-black text-slate-900 tabular-nums flex-shrink-0">${formatMoney(it.lineTotal)} ج</div>
                            </div>
                          `
                        )
                        .join('')}
                    </div>

                    ${
                      order.notes || order.phone
                        ? `<div class="mb-3 text-xs text-slate-600 space-y-1 bg-white rounded-xl p-2.5 border border-slate-200">
                            ${order.phone ? `<div>📞 <strong>موبايل العميل:</strong> <span class="tabular-nums">${escapeHtml(order.phone)}</span></div>` : ''}
                            ${order.notes ? `<div>📝 <strong>ملاحظات:</strong> ${escapeHtml(order.notes)}</div>` : ''}
                          </div>`
                        : ''
                    }

                    <div class="flex items-center justify-end">
                      <a
                        href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildWhatsAppMessage(order))}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="min-h-[42px] px-4 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-extrabold inline-flex items-center gap-1.5 transition-colors"
                      >
                        <span>إعادة فتح الفاتورة في واتساب</span>
                      </a>
                    </div>
                  </div>`
                : ''
            }
          </article>
        `;
      }

      // =========================================================================
      // MODALS & DRAWERS
      // =========================================================================
      function closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        root.innerHTML = '';
        document.body.style.overflow = '';
      }

      function openModal(html) {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">
            ${html}
          </div>
        `;
        root.classList.remove('hidden');
        document.body.style.overflow = 'hidden';

        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        });
      }

      function openCheckoutDrawer() {
        const summary = getCartSummary();
        if (!summary.hasItems) return;

        if (summary.totalAmount < MIN_ORDER_VALUE) {
          const remaining = MIN_ORDER_VALUE - summary.totalAmount;
          showToast(`الحد الأدنى للطلب ${formatMoney(MIN_ORDER_VALUE)} ج — فاضلك ${formatMoney(remaining)} جنيه`, 'warning');
          return;
        }

        const profile = state.savedCustomerProfile;
        if (profile) {
          if (!state.checkoutDraft.shopName) state.checkoutDraft.shopName = profile.shopName || '';
          if (!state.checkoutDraft.address) state.checkoutDraft.address = profile.address || '';
          if (!state.checkoutDraft.phone) state.checkoutDraft.phone = profile.phone || '';
        }

        openModal(`
          <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div>
                <h2 class="text-lg font-black text-slate-900">مراجعة وإرسال الطلب</h2>
                <p class="text-xs font-semibold text-slate-500">فاتورة فورية عبر واتساب + إرسال مباشر للمكتب للاعتماد</p>
              </div>
              <button type="button" id="btn-close-modal" class="w-10 h-10 rounded-full bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600" aria-label="إغلاق">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4">
              ${
                profile && profile.shopName
                  ? `<div class="bg-sky-50 border border-sky-200 text-sky-900 rounded-xl px-3.5 py-2.5 text-xs font-extrabold flex items-center gap-2">
                      <span>👋</span>
                      <span>أهلاً بعودتك يا ${escapeHtml(profile.shopName)} — بياناتك محفوظة للطلب السريع</span>
                    </div>`
                  : ''
              }

              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-extrabold text-slate-700">الأصناف المطلوبة (${summary.lines.length})</span>
                  <button type="button" id="btn-clear-cart" class="text-xs font-bold text-red-600 hover:underline">تفريغ السلة</button>
                </div>
                <div class="bg-slate-50 rounded-2xl border border-slate-200 divide-y divide-slate-200/80">
                  ${summary.lines
                    .map(
                      (line) => `
                        <div class="p-3 flex items-start justify-between gap-2">
                          <div class="min-w-0">
                            <p class="text-xs sm:text-sm font-extrabold text-slate-900 leading-snug">${escapeHtml(line.name)}</p>
                            <div class="mt-1 text-xs font-semibold text-slate-600 flex flex-wrap items-center gap-2">
                              ${line.cartons > 0 ? `<span class="bg-white border border-slate-200 px-2 py-0.5 rounded-md tabular-nums">${line.cartons} كرتونة × ${formatMoney(line.cartonPrice)} ج</span>` : ''}
                              ${line.packets > 0 ? `<span class="bg-white border border-slate-200 px-2 py-0.5 rounded-md tabular-nums">${line.packets} شرنك × ${formatMoney(line.packetPrice)} ج</span>` : ''}
                              ${line.bonusCartons > 0 ? `<span class="bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-md font-extrabold">🎁 +${line.bonusCartons} كرتونة هدية</span>` : ''}
                            </div>
                          </div>
                          <div class="text-left flex-shrink-0">
                            <div class="text-sm font-black text-slate-900 tabular-nums">${formatMoney(line.lineTotal)} ج</div>
                          </div>
                        </div>
                      `
                    )
                    .join('')}
                </div>
              </div>

              <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 space-y-1.5">
                <div class="flex items-center justify-between text-xs font-bold text-emerald-900">
                  <span>إجمالي الكميات:</span>
                  <span class="tabular-nums">
                    ${summary.totalCartons > 0 ? `${summary.totalCartons} كرتونة` : ''}
                    ${summary.totalCartons > 0 && summary.totalPackets > 0 ? ' + ' : ''}
                    ${summary.totalPackets > 0 ? `${summary.totalPackets} شرنك` : ''}
                    ${summary.totalBonusCartons > 0 ? ` (+${summary.totalBonusCartons} هدية 🎁)` : ''}
                  </span>
                </div>
                <div class="flex items-center justify-between text-xs font-bold text-emerald-900">
                  <span>التوصيل:</span>
                  <span>${summary.totalAmount >= FREE_DELIVERY_THRESHOLD ? 'مجاني لباب المحل ✓' : `مجاني فوق ${formatMoney(FREE_DELIVERY_THRESHOLD)} ج`}</span>
                </div>
                <div class="pt-2 border-t border-emerald-200 flex items-center justify-between">
                  <span class="text-sm font-black text-emerald-950">الإجمالي المطلوب:</span>
                  <span class="text-xl font-black text-emerald-700 tabular-nums">${formatMoney(summary.totalAmount)} جنيه</span>
                </div>
              </div>

              <form id="checkout-form" class="space-y-3.5" novalidate>
                <div>
                  <label for="input-shop-name" class="block text-xs font-extrabold text-slate-800 mb-1.5">
                    اسم السوبر ماركت / المحل <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="input-shop-name"
                    type="text"
                    required
                    value="${escapeHtml(state.checkoutDraft.shopName)}"
                    placeholder="مثلاً: سوبر ماركت النور - أولاد علي"
                    class="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm font-bold text-slate-900"
                  />
                </div>

                <div>
                  <label for="input-shop-address" class="block text-xs font-extrabold text-slate-800 mb-1.5">
                    العنوان / المنطقة <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="input-shop-address"
                    type="text"
                    required
                    value="${escapeHtml(state.checkoutDraft.address)}"
                    placeholder="مثلاً: شارع الهرم - محطة الطالبية بجوار صيدلية..."
                    class="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm font-bold text-slate-900"
                  />
                </div>

                <div>
                  <label for="input-shop-phone" class="block text-xs font-bold text-slate-700 mb-1.5">
                    رقم الموبايل للتواصل (اختياري)
                  </label>
                  <input
                    id="input-shop-phone"
                    type="tel"
                    inputmode="tel"
                    value="${escapeHtml(state.checkoutDraft.phone)}"
                    placeholder="010xxxxxxxx"
                    class="w-full min-h-[44px] px-3.5 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm font-bold text-slate-900 tabular-nums"
                  />
                </div>

                <div>
                  <span class="block text-xs font-extrabold text-slate-800 mb-1.5">طريقة الدفع</span>
                  <div class="grid grid-cols-2 gap-2.5">
                    <label class="cursor-pointer">
                      <input type="radio" name="paymentMethod" value="كاش عند الاستلام" class="peer sr-only" ${
                        state.checkoutDraft.paymentMethod === 'كاش عند الاستلام' ? 'checked' : ''
                      } />
                      <div class="min-h-[62px] p-3 rounded-xl border-2 border-slate-200 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 text-center transition-all flex flex-col justify-center">
                        <span class="text-xs sm:text-sm font-extrabold text-slate-900">💵 كاش عند الاستلام</span>
                        <span class="text-[10px] font-semibold text-slate-500 mt-0.5">نقدي للسواق</span>
                      </div>
                    </label>
                    <label class="cursor-pointer">
                      <input type="radio" name="paymentMethod" value="آجل (على الحساب)" class="peer sr-only" ${
                        state.checkoutDraft.paymentMethod === 'آجل (على الحساب)' ? 'checked' : ''
                      } />
                      <div class="min-h-[62px] p-3 rounded-xl border-2 border-slate-200 peer-checked:border-amber-500 peer-checked:bg-amber-50 text-center transition-all flex flex-col justify-center">
                        <span class="text-xs sm:text-sm font-extrabold text-slate-900">📒 آجل (على الحساب)</span>
                        <span class="text-[10px] font-bold text-amber-800 mt-0.5 leading-tight">للعملاء المعتمدين لدى المكتب فقط</span>
                      </div>
                    </label>
                  </div>
                </div>

                <div>
                  <label for="input-shop-notes" class="block text-xs font-bold text-slate-700 mb-1.5">ملاحظات إضافية (اختياري)</label>
                  <input
                    id="input-shop-notes"
                    type="text"
                    value="${escapeHtml(state.checkoutDraft.notes)}"
                    placeholder="مثلاً: التسليم بعد الظهر أو الاتصال قبل الوصول"
                    class="w-full min-h-[44px] px-3.5 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none text-sm font-semibold text-slate-900"
                  />
                </div>

                <div id="checkout-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-extrabold rounded-xl px-3.5 py-2.5"></div>

                <button
                  type="submit"
                  class="w-full min-h-[52px] px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-black text-base shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 transition-all"
                >
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/></svg>
                  <span>تأكيد وإرسال الفاتورة عبر واتساب</span>
                </button>
              </form>
            </div>
          </div>
        `);

        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-clear-cart').addEventListener('click', () => {
          state.cart = {};
          closeModal();
          render();
          showToast('تم تفريغ السلة', 'info');
        });

        document.getElementById('checkout-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const shopName = document.getElementById('input-shop-name').value.trim();
          const address = document.getElementById('input-shop-address').value.trim();
          const phone = document.getElementById('input-shop-phone').value.trim();
          const notes = document.getElementById('input-shop-notes').value.trim();
          const paymentInput = document.querySelector('input[name="paymentMethod"]:checked');
          const paymentMethod = paymentInput ? paymentInput.value : 'كاش عند الاستلام';

          state.checkoutDraft = { shopName, address, phone, paymentMethod, notes };

          const errEl = document.getElementById('checkout-error');
          if (!shopName || !address) {
            errEl.textContent = 'برجاء إدخال اسم السوبر ماركت والعنوان / المنطقة أولاً لإرسال الطلب.';
            errEl.classList.remove('hidden');
            return;
          }

          const currentSummary = getCartSummary();
          if (!currentSummary.hasItems) {
            closeModal();
            return;
          }
          if (currentSummary.totalAmount < MIN_ORDER_VALUE) {
            errEl.textContent = `الحد الأدنى للطلب ${formatMoney(MIN_ORDER_VALUE)} جنيه.`;
            errEl.classList.remove('hidden');
            return;
          }

          // Save repeat customer profile automatically
          const nextProfile = { shopName, address, phone };
          state.savedCustomerProfile = nextProfile;
          saveCustomerProfile(nextProfile);

          const newOrder = {
            id: `ORD-${state.nextOrderNumber}`,
            number: state.nextOrderNumber,
            createdAt: getNowArabicTime(),
            shopName,
            address,
            phone,
            paymentMethod,
            notes,
            status: 'new', // Lands in approval gate first
            actualCashCollected: null,
            remainingCredit: null,
            settledAt: null,
            totalAmount: currentSummary.totalAmount,
            totalCartons: currentSummary.totalCartons,
            totalPackets: currentSummary.totalPackets,
            totalBonusCartons: currentSummary.totalBonusCartons,
            items: currentSummary.lines.map((l) => ({
              productId: l.productId,
              name: l.name,
              cartons: l.cartons,
              packets: l.packets,
              cartonPrice: l.cartonPrice,
              packetPrice: l.packetPrice,
              bonusCartons: l.bonusCartons,
              lineTotal: l.lineTotal,
            })),
          };

          state.orders.unshift(newOrder);
          state.nextOrderNumber += 1;
          state.cart = {};
          state.checkoutDraft.notes = '';
          persistState();
          render();

          const waText = buildWhatsAppMessage(newOrder);
          const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;

          try {
            window.open(waUrl, '_blank', 'noopener,noreferrer');
          } catch (_) {}

          openOrderSuccessModal(newOrder, waText, waUrl);
          showToast(`تم تسجيل الأوردر #${newOrder.number} في بوابة اعتماد التاجر!`, 'success');
        });
      }

      function openOrderSuccessModal(order, waText, waUrl) {
        openModal(`
          <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
            <div class="bg-emerald-600 text-white p-5 text-center">
              <div class="w-12 h-12 rounded-full bg-white/20 mx-auto flex items-center justify-center mb-2">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              </div>
              <h2 class="text-xl font-black">تم إرسال طلبك رقم #${order.number}</h2>
              <p class="text-xs font-semibold text-emerald-100 mt-1">الطلب وصل للوحة التاجر كـ "طلب جديد" وبانتظار الاعتماد والتحويل للمخزن</p>
            </div>

            <div class="p-5 overflow-y-auto space-y-4">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-xs font-extrabold text-slate-700">معاينة رسالة فاتورة واتساب:</span>
                  <button type="button" id="btn-copy-invoice" class="text-xs font-extrabold text-emerald-700 hover:underline">نسخ النص</button>
                </div>
                <pre class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-xs font-sans whitespace-pre-wrap text-slate-800 leading-relaxed max-h-56 overflow-y-auto">${escapeHtml(waText)}</pre>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <a
                  href="${waUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="min-h-[48px] px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm flex items-center justify-center gap-2 transition-colors"
                >
                  <span>فتح واتساب الآن</span>
                </a>
                <button
                  type="button"
                  id="btn-go-merchant-orders"
                  class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm flex items-center justify-center gap-2 transition-colors"
                >
                  <span>اعتماد في لوحة التاجر</span>
                </button>
              </div>

              <button type="button" id="btn-done-modal" class="w-full min-h-[44px] rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors">
                متابعة التسوق
              </button>
            </div>
          </div>
        `);

        document.getElementById('btn-copy-invoice').addEventListener('click', () => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(waText).then(() => showToast('تم نسخ الفاتورة ✓'));
          } else {
            showToast('انسخ النص مباشرة من المعاينة', 'info');
          }
        });
        document.getElementById('btn-go-merchant-orders').addEventListener('click', () => {
          closeModal();
          state.role = 'merchant';
          state.merchantTab = 'orders';
          state.expandedOrders[order.id] = true;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.getElementById('btn-done-modal').addEventListener('click', closeModal);
      }

      function openSettlementModal(order) {
        const isCash = order.paymentMethod.includes('كاش');
        const defaultCash =
          order.actualCashCollected != null
            ? order.actualCashCollected
            : isCash
            ? order.totalAmount
            : 0;

        openModal(`
          <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden animate-slide-up">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div>
                <h2 class="text-lg font-black text-slate-900">💰 تسليم وتقفيل الحساب</h2>
                <p class="text-xs font-semibold text-slate-500">أوردر #${order.number} — ${escapeHtml(order.shopName)}</p>
              </div>
              <button type="button" id="btn-close-modal" class="w-10 h-10 rounded-full bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600" aria-label="إغلاق">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>

            <form id="settlement-form" class="p-5 space-y-4" novalidate>

        const cashInput = document.getElementById('input-actual-cash');
        const previewCash = document.getElementById('settle-preview-cash');
        const previewCredit = document.getElementById('settle-preview-credit');

        function updateSettlementPreview() {
          const val = Math.max(0, parseFloat(cashInput.value) || 0);
          const capped = Math.min(val, order.totalAmount);
          const credit = Math.max(0, +(order.totalAmount - capped).toFixed(2));
          previewCash.textContent = `${formatMoney(capped)} ج`;
          previewCredit.textContent = `${formatMoney(credit)} ج`;
        }

        cashInput.addEventListener('input', updateSettlementPreview);
        document.querySelectorAll('[data-quick-cash]').forEach((btn) => {
          btn.addEventListener('click', () => {
            cashInput.value = btn.getAttribute('data-quick-cash');
            updateSettlementPreview();
          });
        });

        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('settlement-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const val = parseFloat(normalizeArabicDigits(cashInput.value));
          const errEl = document.getElementById('settle-error');
          if (!Number.isFinite(val) || val < 0 || val > order.totalAmount) {
            errEl.textContent = `برجاء إدخال مبلغ بين 0 و ${formatMoney(order.totalAmount)} جنيه.`;
            errEl.classList.remove('hidden');
            return;
          }

          order.actualCashCollected = +val.toFixed(2);
          order.remainingCredit = +Math.max(0, order.totalAmount - order.actualCashCollected).toFixed(2);
          order.status = 'settled';
          order.settledAt = getNowArabicTime();
          persistState();
          closeModal();
          render();
          showToast(
            `تم تقفيل أوردر #${order.number}: كاش ${formatMoney(order.actualCashCollected)} ج • آجل ${formatMoney(order.remainingCredit)} ج ✓`
          );
        });
      }
