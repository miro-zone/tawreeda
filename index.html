<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>توريدة (Tawreeda) | كتالوج جملة المواد الغذائية وإدارة التوزيع</title>
  <meta name="description" content="توريدة - نظام فوري لطلبات الجملة وإدارة الأسعار والمخزون وتحميل سيارات التوزيع وعهدة السواق لتجار المواد الغذائية والسوبر ماركت في مصر." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'Tajawal', 'Segoe UI', 'Tahoma', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- Top Sticky Role Switcher & Demo Bar -->
  <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md no-print">
    <div class="max-w-4xl mx-auto px-3 sm:px-4 py-2.5">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center shadow-sm flex-shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-lg font-extrabold tracking-tight leading-none">توريدة</span>
              <span class="text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded-md">نسخة تجريبية</span>
            </div>
            <p class="text-[11px] text-slate-400 leading-tight mt-0.5">نظام جملة الجملة الفوري</p>
          </div>
        </div>

        <button
          id="btn-reset-demo"
          type="button"
          class="inline-flex items-center gap-1.5 px-2.5 py-1.5 min-h-[36px] rounded-lg text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors"
          title="إعادة ضبط الأسعار والمخزون والأوردرات للحالة التجريبية"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          <span>إعادة ضبط البيانات التجريبية</span>
        </button>
      </div>

      <!-- Role Switcher Segmented Control -->
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-800 rounded-xl border border-slate-700/80" role="tablist" aria-label="تبديل الواجهة">
        <button
          id="role-customer"
          type="button"
          role="tab"
          class="min-h-[44px] px-3 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all"
        >
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" />
          </svg>
          <span class="truncate">واجهة العميل (السوبر ماركت)</span>
        </button>

        <button
          id="role-merchant"
          type="button"
          role="tab"
          class="min-h-[44px] px-3 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all"
        >
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
          </svg>
          <span class="truncate">لوحة تحكم التاجر (الأدمن)</span>
          <span id="header-orders-badge" class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 text-xs font-extrabold rounded-full bg-amber-400 text-slate-900 tabular-nums">0</span>
        </button>
      </div>

      <!-- Demo Notice Pill -->
      <div class="mt-2 flex justify-center">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-800/90 border border-slate-700/90 text-[11px] font-semibold text-slate-300">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"></span>
          <span>شريط معاينة للعرض فقط — العميل في النسخة الفعلية يشاهد الكتالوج فقط</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-main" class="max-w-4xl mx-auto px-3 sm:px-4 pt-3 pb-36"></main>

  <!-- Sticky Bottom Cart Bar (Customer View) -->
  <div id="sticky-cart-bar" class="fixed bottom-0 inset-x-0 z-30 hidden no-print">
    <div class="max-w-4xl mx-auto px-3 pb-3 pt-1">
      <div class="bg-slate-900 text-white rounded-2xl shadow-xl border border-slate-700/80 p-3 sm:p-3.5">
        <div id="cart-delivery-progress" class="mb-2.5"></div>
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-baseline gap-1.5 flex-wrap">
              <span class="text-xs text-slate-300 font-semibold">الإجمالي:</span>
              <span id="cart-bar-total" class="text-xl sm:text-2xl font-black text-emerald-400 tabular-nums">0 ج</span>
            </div>
            <div id="cart-bar-summary" class="text-xs text-slate-300 font-medium flex items-center gap-2 flex-wrap mt-0.5"></div>
          </div>
          <button
            id="btn-open-checkout"
            type="button"
            class="min-h-[48px] px-4 sm:px-6 py-2.5 rounded-xl font-extrabold text-sm sm:text-base shadow-lg flex items-center gap-2 transition-all flex-shrink-0"
          >
            <span id="btn-open-checkout-label">مراجعة وإرسال الطلب</span>
            <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Save Prices Bar (Merchant Tab 1) -->
  <div id="floating-save-bar" class="fixed bottom-0 inset-x-0 z-30 hidden no-print">
    <div class="max-w-4xl mx-auto px-3 pb-3">
      <div class="bg-slate-900 text-white rounded-2xl shadow-xl border border-emerald-500/40 p-3 flex items-center justify-between gap-3 animate-slide-up">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-9 h-9 rounded-xl bg-amber-400/20 text-amber-300 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z" />
            </svg>
          </span>
          <div class="min-w-0">
            <p class="text-sm font-bold leading-tight">تعديلات أسعار غير محفوظة</p>
            <p id="unsaved-count-text" class="text-xs text-slate-300 mt-0.5">0 أصناف تم تعديلها</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button
            id="btn-discard-prices"
            type="button"
            class="min-h-[44px] px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition-colors"
          >إلغاء</button>
          <button
            id="btn-save-prices"
            type="button"
            class="min-h-[44px] px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 text-xs sm:text-sm font-extrabold shadow-md flex items-center gap-1.5 transition-all"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
            <span>حفظ التعديلات وتحديث الكتالوج</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal / Drawer Root -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden no-print" aria-modal="true" role="dialog"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-24 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none no-print"></div>


  <script type="module" src="./js/app.js"></script>
</body>
</html>
