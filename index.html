      to { opacity: 1; }

          return fresh;
        }
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.products) || !Array.isArray(parsed.orders)) {
            throw new Error('Invalid state shape');
          }
          return {
            products: parsed.products,
            orders: parsed.orders,
            nextOrderNumber: parsed.nextOrderNumber || 1003,
            pickingChecked: parsed.pickingChecked || {},
          };
        } catch (_) {
          const fresh = getInitialPersistedState();
          safeStorage.set(STORAGE_KEY, JSON.stringify(fresh));
          return fresh;

      // =========================================================================
      // HELPERS & FORMATTING
      // =========================================================================
      function formatMoney(num) {
        const n = Number(num) || 0;
        return n.toLocaleString('en-US', {
          minimumFractionDigits: n % 1 === 0 ? 0 : 2,
          maximumFractionDigits: 2,
        });
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function parseBonusRule(promoText) {
        if (!promoText) return { bonusBuy: 0, bonusFree: 0 };
        const match = promoText.match(/(\d+)\s*\+\s*(\d+)/);
        if (match) {
          return {
            bonusBuy: parseInt(match[1], 10) || 0,
            bonusFree: parseInt(match[2], 10) || 0,
          };
        }
        return { bonusBuy: 0, bonusFree: 0 };
      }

      function calcBonusCartons(product, cartonsQty) {
        if (!product.bonusBuy || !product.bonusFree || cartonsQty < product.bonusBuy) return 0;
        return Math.floor(cartonsQty / product.bonusBuy) * product.bonusFree;
      }

      function calcUnitCostForMode(product, mode) {
        if (mode === 'packet' && product.packetPrice != null) {
          if (product.unitsPerPacket && product.unitsPerPacket > 0) {
            return +(product.packetPrice / product.unitsPerPacket).toFixed(2);
          }
          if (product.unitsPerCarton && product.unitsPerCarton > 0) {
            return +(product.packetPrice / (product.unitsPerCarton / 2)).toFixed(2);
          }
        }
        if (product.unitsPerCarton && product.unitsPerCarton > 0) {
          return +(product.cartonPrice / product.unitsPerCarton).toFixed(2);
        }
        return Number(product.unitCost) || 0;
      }

      function getNowArabicTime() {
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const period = h >= 12 ? 'م' : 'ص';
        h = h % 12 || 12;
        return `${String(h).padStart(2, '0')}:${m} ${period}`;
      }

      function getCartSummary() {
        let totalAmount = 0;
        let totalCartons = 0;
        let totalPackets = 0;
        let totalBonusCartons = 0;
        const lines = [];

        state.products.forEach((p) => {
          const entry = state.cart[p.id];
          if (!entry) return;
          if (!p.inStock) return; // Automatically exclude out-of-stock items
          const cartons = entry.cartons || 0;
          const packets = p.packetPrice != null ? (entry.packets || 0) : 0;
          if (cartons <= 0 && packets <= 0) return;

          const bonusCartons = calcBonusCartons(p, cartons);
          const lineTotal = cartons * p.cartonPrice + packets * (p.packetPrice || 0);
          totalAmount += lineTotal;
          totalCartons += cartons;
          totalPackets += packets;
          totalBonusCartons += bonusCartons;

          lines.push({
            productId: p.id,
            name: p.name,
            cartons,
            packets,
            cartonPrice: p.cartonPrice,
            packetPrice: p.packetPrice,
            bonusCartons,
            lineTotal,
            product: p,
          });
        });

        return {
          lines,
          totalAmount,
          totalCartons,
          totalPackets,
          totalBonusCartons,
          hasItems: lines.length > 0,
        };
      }

      function getFilteredCustomerProducts() {
        const q = state.searchQuery.trim().toLowerCase();
        const filtered = state.products.filter((p) => {
          if (state.activeCategory === 'عروض') {
            if (!p.isClearance && !p.promoText) return false;
          } else if (state.activeCategory !== 'الكل') {
            if (p.category !== state.activeCategory) return false;
          }
          if (q) {
            const hay = `${p.name} ${p.category} ${p.promoText || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        // Sort: Available Clearance first -> Available Normal/Promo -> Out of Stock last
        return filtered.sort((a, b) => {
          const score = (item) => {
            if (!item.inStock) return 3;
            if (item.isClearance) return 0;
            if (item.promoText) return 1;
            return 2;
          };
          return score(a) - score(b);
        });
      }

                    <div class="flex items-center gap-1.5 text-xs font-extrabold">
                      <span>🔥</span>
                      <span>تصفية سريعة - خصم خاص (صلاحية قريبة)</span>
                    </div>
                    ${
                      savings > 0
                        ? `<span class="text-[11px] font-black bg-white text-red-700 px-2 py-0.5 rounded-full tabular-nums">وفر ${formatMoney(savings)} ج</span>`
                        : `<span class="text-[11px] font-black bg-white/20 text-white px-2 py-0.5 rounded-full">حرق سعر</span>`
                    }
                  </div>`
                : ''
            }

            <!-- Out of Stock Top Banner -->
            ${
              !p.inStock
                ? `<div class="bg-slate-200 text-slate-700 px-3.5 py-2 flex items-center justify-between gap-2">
                    <span class="text-xs font-extrabold flex items-center gap-1.5">
                      <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                      خلصان حالاً - بيتوفر بكرة
                    </span>
                    <span class="text-[11px] font-bold text-slate-500">غير متاح للطلب</span>
                  </div>`
                : ''
            }

            <div class="p-3.5 sm:p-4 flex-1 flex flex-col">
              <!-- Category & Name -->
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="inline-block text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md mb-1.5">${escapeHtml(p.category)}</span>
                  <h2 class="text-base font-extrabold text-slate-900 leading-snug">${escapeHtml(p.name)}</h2>
                </div>
                ${
                  p.inStock && (cartEntry.cartons > 0 || cartEntry.packets > 0)
                    ? `<div class="flex flex-col items-end gap-1 flex-shrink-0">
                        ${
                          cartEntry.cartons > 0
                            ? `<span class="text-[11px] font-extrabold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-lg tabular-nums">${cartEntry.cartons} كرتونة</span>`
                            : ''
                        }
                        ${
                          cartEntry.packets > 0
                            ? `<span class="text-[11px] font-extrabold bg-sky-100 text-sky-800 px-2 py-0.5 rounded-lg tabular-nums">${cartEntry.packets} شرنك</span>`
                            : ''
                        }
                      </div>`
                    : ''
                }
              </div>

              <!-- Promo Badge (Non-Clearance or Bonus) -->
              ${
                p.promoText && !p.isClearance && p.inStock
                  ? `<div class="mt-2.5 flex items-center gap-1.5 bg-amber-50 border border-amber-300 text-amber-900 px-2.5 py-1.5 rounded-xl text-xs font-extrabold">
                      <span>🎁</span>
                      <span>${escapeHtml(p.promoText)}</span>
                    </div>`
                  : ''
              }

              <!-- Unit Selector (Carton vs Packet) -->
              <div class="mt-3 grid grid-cols-2 gap-2">
                <button
                  type="button"
                  data-select-unit="carton"
                  data-pid="${p.id}"
                  ${!p.inStock ? 'disabled' : ''}
                  class="min-h-[54px] px-2.5 py-2 rounded-xl border-2 text-right transition-all flex flex-col justify-center ${
                    selectedMode === 'carton'
                      ? 'border-emerald-600 bg-emerald-50/70'
                      : 'border-slate-200 bg-slate-50 hover:border-slate-300'
                  } ${!p.inStock ? 'cursor-not-allowed' : 'cursor-pointer'}"
                >
                  <div class="flex items-center justify-between w-full">
                    <span class="text-xs font-bold ${selectedMode === 'carton' ? 'text-emerald-900' : 'text-slate-600'}">الكرتونة</span>
                    ${
                      p.isClearance && p.originalCartonPrice && p.originalCartonPrice > p.cartonPrice
                        ? `<span class="text-[11px] text-slate-400 line-through tabular-nums">${formatMoney(p.originalCartonPrice)} ج</span>`
                        : ''
                    }
                  </div>
                  <div class="text-base font-black tabular-nums ${selectedMode === 'carton' ? 'text-emerald-700' : 'text-slate-900'}">
                    ${formatMoney(p.cartonPrice)} <span class="text-xs font-bold">ج</span>
                  </div>
                </button>

                ${
                  hasPacket
                    ? `<button
                        type="button"
                        data-select-unit="packet"
                        data-pid="${p.id}"
                        ${!p.inStock ? 'disabled' : ''}
                        class="min-h-[54px] px-2.5 py-2 rounded-xl border-2 text-right transition-all flex flex-col justify-center ${
                          selectedMode === 'packet'
                            ? 'border-emerald-600 bg-emerald-50/70'
                            : 'border-slate-200 bg-slate-50 hover:border-slate-300'
                        } ${!p.inStock ? 'cursor-not-allowed' : 'cursor-pointer'}"
                      >
                        <span class="text-xs font-bold ${selectedMode === 'packet' ? 'text-emerald-900' : 'text-slate-600'}">الشرنك / الباكت</span>
                        <div class="text-base font-black tabular-nums ${selectedMode === 'packet' ? 'text-emerald-700' : 'text-slate-900'}">
                          ${formatMoney(p.packetPrice)} <span class="text-xs font-bold">ج</span>
                        </div>
                      </button>`
                    : `<div class="min-h-[54px] px-2.5 py-2 rounded-xl border border-dashed border-slate-200 bg-slate-50 flex flex-col justify-center items-center text-center">
                        <span class="text-[11px] font-bold text-slate-400">يباع بالكرتونة فقط</span>
                        <span class="text-[10px] text-slate-400">غير متاح شرنك</span>
                      </div>`
                }
              </div>

              <!-- Single Piece Cost Highlight -->
              <div class="mt-2.5 flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2">
                <span class="text-xs font-bold text-slate-600">تقف عليك بـ</span>
                <span class="text-sm font-black text-slate-900 tabular-nums">
                  ${formatMoney(unitCost)} جنيه <span class="text-xs font-semibold text-slate-500">/ لل${escapeHtml(p.unitLabel || 'قطعة')}</span>
                </span>
              </div>

              <!-- Bonus Earned / Progress Nudge -->
              ${
                earnedBonus > 0
                  ? `<div class="mt-2 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-extrabold flex items-center justify-between">
                      <span>🎉 كسبت +${earnedBonus} كرتونة هدية مجاناً!</span>
                      ${toNextBonus > 0 && toNextBonus <= 3 ? `<span class="text-[11px] font-bold text-emerald-700">باقي ${toNextBonus} لهدية تانية</span>` : ''}
                    </div>`
                  : toNextBonus > 0 && toNextBonus < p.bonusBuy
                  ? `<div class="mt-2 px-3 py-1.5 rounded-xl bg-amber-50/70 border border-amber-200 text-amber-800 text-[11px] font-bold flex items-center justify-between">
                      <span>فاضلك ${toNextBonus} كرتونة وتاخد ${p.bonusFree} كرتونة هدية 🎁</span>
                      <button type="button" data-quick-add="${toNextBonus}" data-pid="${p.id}" data-unit="carton" class="underline font-extrabold text-amber-900 mr-2">كمّل العرض</button>
                    </div>`
                  : ''
              }

              <!-- Quantity Controls -->
              <div class="mt-auto pt-3">
                ${
                  !p.inStock
                    ? `<button type="button" disabled class="w-full min-h-[46px] rounded-xl bg-slate-200 text-slate-500 font-extrabold text-sm cursor-not-allowed">
                        خلصان حالاً - غير متاح للطلب
                      </button>`
                    : activeQty === 0
                    ? `<div class="flex items-center gap-2">
                        <button
                          type="button"
                          data-qty-delta="1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          class="flex-1 min-h-[46px] px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition-all"
                        >
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                          <span>أضف ${selectedMode === 'carton' ? 'كرتونة' : 'شرنك'} (${formatMoney(currentPrice)} ج)</span>
                        </button>
                        ${
                          selectedMode === 'carton' && p.bonusBuy > 0
                            ? `<button
                                type="button"
                                data-quick-add="${p.bonusBuy}"
                                data-pid="${p.id}"
                                data-unit="carton"
                                title="إضافة ${p.bonusBuy} كراتين للاستفادة من العرض"
                                class="min-h-[46px] px-3 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-extrabold text-xs whitespace-nowrap transition-colors"
                              >+${p.bonusBuy} للعرض</button>`
                            : ''
                        }
                      </div>`
                    : `<div class="flex items-center justify-between gap-2 bg-slate-50 p-1 rounded-xl border border-emerald-300">
                        <button
                          type="button"
                          data-qty-delta="1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          aria-label="زيادة الكمية"
                          class="w-12 h-[44px] rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-xl flex items-center justify-center transition-all"
                        >+</button>
                        <div class="text-center flex-1">
                          <div class="text-base font-black text-slate-900 tabular-nums leading-tight">${activeQty} <span class="text-xs font-bold text-slate-600">${selectedMode === 'carton' ? 'كرتونة' : 'شرنك'}</span></div>
                          <div class="text-[11px] font-bold text-emerald-700 tabular-nums">${formatMoney(activeQty * currentPrice)} ج</div>
                        </div>
                        <button
                          type="button"
                          data-qty-delta="-1"
                          data-pid="${p.id}"
                          data-unit="${selectedMode}"
                          aria-label="تقليل الكمية"
                          class="w-12 h-[44px] rounded-lg bg-white hover:bg-red-50 active:scale-95 text-slate-800 hover:text-red-600 border border-slate-300 font-black text-xl flex items-center justify-center transition-all"
                        >−</button>
                      </div>`
                }
              </div>
            </div>
          </article>
        `;
      }

      // =========================================================================
      // VIEW 2: MERCHANT DASHBOARD
      // =========================================================================
      function renderMerchantView() {
        const pendingOrders = state.orders.filter((o) => o.status === 'pending').length;

        return `
          <!-- Merchant Sub-Tabs -->
          <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-2 mb-3.5 no-print">
            <div class="grid grid-cols-2 gap-1.5">
              <button
                id="merchant-tab-inventory"
                type="button"
                class="min-h-[48px] px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 transition-all ${
                  state.merchantTab === 'inventory'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'bg-slate-50 text-slate-700 hover:bg-slate-100'
                }"
              >
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
                </svg>
                <span>إدارة الأسعار والمخزون</span>
              </button>

              <button
                id="merchant-tab-orders"
                type="button"
                class="min-h-[48px] px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 transition-all ${
                  state.merchantTab === 'orders'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'bg-slate-50 text-slate-700 hover:bg-slate-100'
                }"
              >
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z" />
                </svg>
                <span>أوردرات اليوم وتحميل العربية</span>
                ${
                  pendingOrders > 0
                    ? `<span class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 text-xs font-black rounded-full ${
                        state.merchantTab === 'orders' ? 'bg-amber-400 text-slate-950' : 'bg-red-500 text-white'
                      } tabular-nums">${pendingOrders}</span>`
                    : ''
                }
              </button>
            </div>
          </section>

          ${state.merchantTab === 'inventory' ? renderMerchantInventoryTab() : renderMerchantOrdersTab()}
        `;
      }

      // ---- Merchant Tab 1: Quick Price & Stock Manager ----
      function renderMerchantInventoryTab() {
        const total = state.products.length;
        const available = state.products.filter((p) => p.inStock).length;
        const outOfStock = total - available;
        const clearance = state.products.filter((p) => p.isClearance && p.inStock).length;

        const q = state.merchantSearchQuery.trim().toLowerCase();
        const filtered = state.products.filter((p) => {
          if (!q) return true;
          return `${p.name} ${p.category}`.toLowerCase().includes(q);
        });

        return `
          <!-- Quick Stats & Add New Item -->
          <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 sm:p-4 mb-3.5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div>
                <h1 class="text-base sm:text-lg font-black text-slate-900">تحديث الأسعار والمخزون لحظياً</h1>
                <p class="text-xs text-slate-500 mt-0.5">عدّل أي سعر مباشرة أو فعّل "خلصان / حرق سعر" لينعكس فوراً عند السوبر ماركت</p>
              </div>
              <button
                id="btn-open-add-product"
                type="button"
                class="min-h-[44px] px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white text-xs sm:text-sm font-extrabold flex items-center gap-1.5 shadow-sm transition-all"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                <span>إضافة صنف جديد</span>
              </button>
            </div>

            <!-- Compact Inventory KPIs -->
            <div class="grid grid-cols-3 gap-2 mb-3">
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-emerald-700 tabular-nums">${available}</div>
                <div class="text-[11px] font-bold text-emerald-900">صنف متاح</div>
              </div>
              <div class="bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-slate-700 tabular-nums">${outOfStock}</div>
                <div class="text-[11px] font-bold text-slate-600">خلصان</div>
              </div>
              <div class="bg-orange-50 border border-orange-200 rounded-xl p-2.5 text-center">
                <div class="text-lg font-black text-orange-700 tabular-nums">${clearance}</div>
                <div class="text-[11px] font-bold text-orange-900">حرق أسعار</div>
              </div>
            </div>

            <!-- Search in Merchant List -->
            <div class="relative">
              <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
              </div>
              <input
                id="merchant-search-input"
                type="search"
                value="${escapeHtml(state.merchantSearchQuery)}"
                placeholder="فلترة الأصناف للتعديل السريع..."
                class="w-full min-h-[44px] pr-10 pl-4 py-2 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white outline-none text-sm font-semibold text-slate-900"
              />
            </div>
          </section>

          <!-- Editable Product Rows -->
          <section class="space-y-3">
            ${filtered.map(renderMerchantProductRow).join('')}
          </section>
        `;
      }

      function renderMerchantProductRow(p) {
        const pending = state.pendingPriceEdits[p.id] || {};
        const cartonVal = pending.cartonPrice !== undefined ? pending.cartonPrice : p.cartonPrice;
        const packetVal =
          pending.packetPrice !== undefined
            ? pending.packetPrice
            : p.packetPrice != null
            ? p.packetPrice
            : '';

        const isDirty = pending.cartonPrice !== undefined || pending.packetPrice !== undefined;
        const liveUnitCost =
          p.unitsPerCarton && Number(cartonVal) > 0
            ? +(Number(cartonVal) / p.unitsPerCarton).toFixed(2)
            : p.unitCost;

        return `
          <div class="bg-white rounded-2xl border ${
            isDirty
              ? 'border-amber-400 ring-2 ring-amber-200/60'
              : p.isClearance
              ? 'border-orange-300'
              : !p.inStock
              ? 'border-slate-200 bg-slate-50/70'
              : 'border-slate-200'
          } shadow-sm p-3.5 sm:p-4 transition-all" data-merchant-row="${p.id}">
            <!-- Row Header -->
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">${escapeHtml(p.category)}</span>
                  ${
                    !p.inStock
                      ? `<span class="text-[11px] font-extrabold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md">خلصان</span>`
                      : ''
                  }
                  ${
                    p.isClearance
                      ? `<span class="text-[11px] font-extrabold bg-orange-100 text-red-700 px-2 py-0.5 rounded-md">🔥 حرق سعر - مثبت بالأعلى</span>`
                      : ''
                  }
                  ${
                    p.promoText && !p.isClearance
                      ? `<span class="text-[11px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md">🎁 ${escapeHtml(p.promoText)}</span>`
                      : ''
                  }
                </div>
                <h2 class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug">${escapeHtml(p.name)}</h2>
              </div>
              <div class="text-left flex-shrink-0">
                <span class="text-[11px] text-slate-500 block">سعر القطعة</span>
                <span id="live-unit-cost-${p.id}" class="text-sm font-black text-emerald-700 tabular-nums">${formatMoney(liveUnitCost)} ج</span>
              </div>
            </div>

            <!-- Inline Price Inputs -->
            <div class="grid grid-cols-2 gap-2.5 mb-3">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" for="price-carton-${p.id}">سعر الكرتونة (ج)</label>
                <div class="relative">
                  <input
                    id="price-carton-${p.id}"
                    type="number"
                    inputmode="decimal"
                    min="1"
                    step="any"
                    value="${escapeHtml(cartonVal)}"
                    data-price-input="carton"
                    data-pid="${p.id}"
                    class="w-full min-h-[44px] px-3 py-2 rounded-xl border-2 ${
                      pending.cartonPrice !== undefined
                        ? 'border-amber-400 bg-amber-50/40'
                        : 'border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500'
                    } outline-none text-base font-black text-slate-900 tabular-nums transition-colors"
                  />
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">ج</span>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" for="price-packet-${p.id}">سعر الشرنك / الباكت (ج)</label>
                <div class="relative">
                  <input
                    id="price-packet-${p.id}"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    value="${escapeHtml(packetVal)}"
                    placeholder="كرتونة فقط"
                    data-price-input="packet"
                    data-pid="${p.id}"
                    class="w-full min-h-[44px] px-3 py-2 rounded-xl border-2 ${
                      pending.packetPrice !== undefined
                        ? 'border-amber-400 bg-amber-50/40'
                        : 'border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500'
                    } outline-none text-base font-black text-slate-900 placeholder:text-xs placeholder:font-semibold placeholder:text-slate-400 tabular-nums transition-colors"
                  />
                  ${
                    packetVal !== ''
                      ? `<span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">ج</span>`
                      : ''
                  }
                </div>
              </div>
            </div>

            <!-- Two Instant Toggle Switches -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2.5 border-t border-slate-100">
              <!-- Toggle 1: In Stock / Out of Stock -->
              <div class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl px-3 py-2 min-h-[48px]">
                <div>
                  <span class="text-xs font-extrabold ${p.inStock ? 'text-emerald-800' : 'text-slate-600'}">
                    ${p.inStock ? 'متاح في المخزن' : 'خلصان (مخفي الطلب)'}
                  </span>
                  <span class="block text-[10px] text-slate-500">تحديث فوري في الكتالوج</span>
                </div>
                <button
                  type="button"
                  role="switch"
                  aria-checked="${p.inStock}"
                  aria-label="تبديل حالة التوفر"
                  data-toggle-stock="${p.id}"
                  data-checked="${p.inStock}"
                  class="toggle-track ${p.inStock ? 'bg-emerald-500' : 'bg-slate-300'}"
                >
                  <span class="toggle-thumb"></span>
                </button>
              </div>

              <!-- Toggle 2: Clearance Mode -->

      // ---- Merchant Tab 2: Today's Orders & Truck Loading List ----
      function getAggregatedPickingList(orders) {
        const map = {};
        orders.forEach((order) => {
          order.items.forEach((item) => {
            const key = item.productId || item.name;
            if (!map[key]) {
              map[key] = {
                key,
                name: item.name,
                cartons: 0,
                packets: 0,
                bonusCartons: 0,
                orderCount: 0,
              };
            }
            map[key].cartons += item.cartons || 0;
            map[key].packets += item.packets || 0;
            map[key].bonusCartons += item.bonusCartons || 0;
            map[key].orderCount += 1;
          });
        });
        return Object.values(map).sort((a, b) => b.cartons + b.bonusCartons - (a.cartons + a.bonusCartons));
      }

      function renderMerchantOrdersTab() {
        const totalOrders = state.orders.length;
        const pendingOrders = state.orders.filter((o) => o.status === 'pending');
        const dispatchedCount = totalOrders - pendingOrders.length;

        const totalSales = state.orders.reduce((s, o) => s + o.totalAmount, 0);
        const cashSales = state.orders
          .filter((o) => o.paymentMethod.includes('كاش'))
          .reduce((s, o) => s + o.totalAmount, 0);
        const creditSales = totalSales - cashSales;
        const cashPct = totalSales > 0 ? Math.round((cashSales / totalSales) * 100) : 0;

        const targetOrders = state.pickingFilter === 'pending' ? pendingOrders : state.orders;
        const aggregated = getAggregatedPickingList(targetOrders);
        const totalLoadCartons = aggregated.reduce((s, i) => s + i.cartons, 0);

        const checkedCount = aggregated.filter((i) => state.pickingChecked[i.key]).length;

        return `

                </span>

              <div class="text-2xl font-black text-slate-900 mt-1.5 tabular-nums">${totalOrders} <span class="text-sm font-bold text-slate-500">أوردر</span></div>
              <div class="mt-1.5 flex items-center gap-2 text-[11px] font-bold">
                <span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">${pendingOrders.length} قيد التحميل</span>
                <span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">${dispatchedCount} خرج للتوصيل</span>
              </div>

            <!-- KPI 2: Total Sales -->

            <!-- KPI 3: Cash vs Credit -->

          <!-- Aggregated Truck Loading Sheet -->
          <section id="print-area" class="bg-white rounded-2xl border-2 border-slate-900 shadow-sm overflow-hidden mb-4">

                <div>

                  </button>
                  <button

                              <label class="flex items-center justify-between gap-3 cursor-pointer select-none">
                                <div class="flex items-center gap-3 min-w-0">

                                    type="checkbox"

                        .join('')}
                    </ul>
                  `
              }
            </div>
          </section>

          <!-- Individual Orders Feed -->
          <section class="no-print">
            <div class="flex items-center justify-between mb-2.5 px-1">
              <h2 class="text-base font-black text-slate-900">تفاصيل أوردرات العملاء (${state.orders.length})</h2>
              <span class="text-xs font-bold text-slate-500">الأحدث أولاً</span>
            </div>

            ${
              state.orders.length === 0
                ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm font-bold text-slate-500">لا توجد أوردرات مستلمة اليوم بعد</div>`
                : `<div class="space-y-3">
                    ${state.orders.map(renderOrderAccordionCard).join('')}
                  </div>`
            }
          </section>
        `;
      }

      function renderOrderAccordionCard(order) {

      // =========================================================================
      // MODALS & DRAWERS (Checkout, Order Success, Add Product, Confirm Reset)
      // =========================================================================
      function closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        root.innerHTML = '';
        document.body.style.overflow = '';
      }

      function openModal(html) {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">
            ${html}
          </div>
        `;
        root.classList.remove('hidden');
        document.body.style.overflow = 'hidden';

        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        });
      }

          state.cart = {};
          closeModal();
          render();
          showToast('تم تفريغ السلة', 'info');
        });

        document.getElementById('checkout-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const shopName = document.getElementById('input-shop-name').value.trim();
          const address = document.getElementById('input-shop-address').value.trim();
          const phone = document.getElementById('input-shop-phone').value.trim();
          const notes = document.getElementById('input-shop-notes').value.trim();
          const paymentInput = document.querySelector('input[name="paymentMethod"]:checked');
          const paymentMethod = paymentInput ? paymentInput.value : 'كاش عند الاستلام';

          state.checkoutDraft = { shopName, address, phone, paymentMethod, notes };

          const errEl = document.getElementById('checkout-error');
          if (!shopName || !address) {
            errEl.textContent = 'برجاء إدخال اسم السوبر ماركت والعنوان / المنطقة أولاً لإرسال الطلب.';
            errEl.classList.remove('hidden');
            return;
          }

          const currentSummary = getCartSummary();
          if (!currentSummary.hasItems) {
            closeModal();
            return;
          }

          const newOrder = {
            id: `ORD-${state.nextOrderNumber}`,
            number: state.nextOrderNumber,
            createdAt: getNowArabicTime(),
            shopName,
            address,
            phone,
            paymentMethod,
            notes,
            status: 'pending',
            totalAmount: currentSummary.totalAmount,
            totalCartons: currentSummary.totalCartons,
            totalPackets: currentSummary.totalPackets,
            totalBonusCartons: currentSummary.totalBonusCartons,
            items: currentSummary.lines.map((l) => ({
              productId: l.productId,
              name: l.name,
              cartons: l.cartons,
              packets: l.packets,
              cartonPrice: l.cartonPrice,
              packetPrice: l.packetPrice,
              bonusCartons: l.bonusCartons,
              lineTotal: l.lineTotal,
            })),
          };

          state.orders.unshift(newOrder);
          state.nextOrderNumber += 1;
          state.cart = {};
          persistState();
          render();

          const waText = buildWhatsAppMessage(newOrder);
          const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;

          // Attempt to open WhatsApp in new tab
          try {
            window.open(waUrl, '_blank', 'noopener,noreferrer');
          } catch (_) {}

          openOrderSuccessModal(newOrder, waText, waUrl);
          showToast(`تم تسجيل الأوردر #${newOrder.number} بنجاح في لوحة التاجر!`, 'success');
        });
      }

          const cartonPrice = parseFloat(document.getElementById('new-prod-carton').value);
          const packetRaw = document.getElementById('new-prod-packet').value.trim();
          const packetPrice = packetRaw ? parseFloat(packetRaw) : null;
          const unitCost = parseFloat(document.getElementById('new-prod-unitcost').value);
          const promoText = document.getElementById('new-prod-promo').value.trim();

          const errEl = document.getElementById('add-prod-error');

            return;

          const unitsPerCarton = Math.max(1, Math.round(cartonPrice / unitCost));

            name,
            category,
            cartonPrice,

            packetPrice: packetPrice && packetPrice > 0 ? packetPrice : null,

            unitCost,

            promoText,
            bonusBuy,
            bonusFree,
            inStock: true,
            isClearance: false,
          };

          state.searchQuery = '';
          state.merchantSearchQuery = '';
          state.activeCategory = 'الكل';
          state.expandedOrders = {};
          persistState();
          closeModal();
          render();
          showToast('تمت إعادة ضبط البيانات التجريبية بنجاح ✓');
        });
      }

      // =========================================================================
      // MAIN RENDER & EVENT BINDING
      // =========================================================================
      function render() {
        updateHeaderUI();
        const main = document.getElementById('app-main');
        main.innerHTML = state.role === 'customer' ? renderCustomerView() : renderMerchantView();
        updateStickyCartBar();
        updateFloatingSaveBar();
        bindViewEvents();
      }

      function bindViewEvents() {
        const main = document.getElementById('app-main');

        // ---- Customer View Events ----
        if (state.role === 'customer') {
          const searchInput = document.getElementById('customer-search-input');
          const clearSearchBtn = document.getElementById('btn-clear-search');
          if (searchInput) {
            searchInput.addEventListener('input', (e) => {
              state.searchQuery = e.target.value;
              if (clearSearchBtn) {
                clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
              }
              const listEl = document.getElementById('customer-products-list');
              const products = getFilteredCustomerProducts();
              listEl.innerHTML =
                products.length === 0
                  ? `<div class="md:col-span-2 bg-white rounded-2xl border border-slate-200 p-8 text-center">
                      <p class="text-base font-bold text-slate-700">مفيش أصناف مطابقة للبحث ده</p>
                      <p class="text-xs text-slate-500 mt-1">جرب تكتب اسم تاني أو اختار قسم "الكل"</p>
                      <button id="btn-reset-filters" type="button" class="mt-4 min-h-[44px] px-5 py-2 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700">عرض كل الأصناف</button>
                    </div>`
                  : products.map(renderCustomerProductCard).join('');
            });
          }

          if (clearSearchBtn) {
            clearSearchBtn.addEventListener('click', () => {
              state.searchQuery = '';
              render();
            });
          }

          main.querySelectorAll('.category-pill').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.activeCategory = btn.getAttribute('data-category');
              render();
            });
          });
        }

        // ---- Merchant View Events ----
        if (state.role === 'merchant') {
          const tabInv = document.getElementById('merchant-tab-inventory');
          const tabOrd = document.getElementById('merchant-tab-orders');
          if (tabInv) {
            tabInv.addEventListener('click', () => {
              state.merchantTab = 'inventory';
              render();
            });
          }
          if (tabOrd) {
            tabOrd.addEventListener('click', () => {
              state.merchantTab = 'orders';
              render();
            });
          }

          const addBtn = document.getElementById('btn-open-add-product');
          if (addBtn) {
            addBtn.addEventListener('click', openAddProductModal);
          }

          const mSearch = document.getElementById('merchant-search-input');
          if (mSearch) {
            mSearch.addEventListener('input', (e) => {
              const pos = e.target.selectionStart;
              state.merchantSearchQuery = e.target.value;
              render();
              const refreshed = document.getElementById('merchant-search-input');
              if (refreshed) {
                refreshed.focus();
                try {
                  refreshed.setSelectionRange(pos, pos);
                } catch (_) {}
              }
            });
          }

          const copyPickBtn = document.getElementById('btn-copy-picking');
          if (copyPickBtn) {
            copyPickBtn.addEventListener('click', () => {
              const targetOrders =
                state.pickingFilter === 'pending'
                  ? state.orders.filter((o) => o.status === 'pending')
                  : state.orders;
              const agg = getAggregatedPickingList(targetOrders);
              if (agg.length === 0) {
                showToast('لا توجد أصناف في ورقة التحميل حالياً', 'warning');
                return;
              }
              const txt = buildPickingListText(agg, state.pickingFilter);
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(() => showToast('تم نسخ ورقة التحميل لإرسالها للمخزن ✓'));
              } else {
                showToast('تم تجهيز ورقة التحميل ✓');
              }
            });
          }

          const printPickBtn = document.getElementById('btn-print-picking');
          if (printPickBtn) {
            printPickBtn.addEventListener('click', () => window.print());
          }
        }
      }

      // =========================================================================
      // DELEGATED INTERACTIONS (Fast & Resilient Across Re-renders)
      // =========================================================================
      document.getElementById('app-main').addEventListener('click', (e) => {
        const target = e.target;

        // Reset customer filters
        if (target.closest('#btn-reset-filters')) {
          state.searchQuery = '';
          state.activeCategory = 'الكل';
          render();
          return;
        }

        // Unit selector on product card
        const unitBtn = target.closest('[data-select-unit]');
        if (unitBtn && !unitBtn.disabled) {
          const pid = unitBtn.getAttribute('data-pid');
          const unit = unitBtn.getAttribute('data-select-unit');
          state.selectedUnitByProduct[pid] = unit;
          render();
          return;
        }

        // Quantity +/- buttons
        const qtyBtn = target.closest('[data-qty-delta]');
        if (qtyBtn) {
          const pid = qtyBtn.getAttribute('data-pid');
          const unit = qtyBtn.getAttribute('data-unit');
          const delta = parseInt(qtyBtn.getAttribute('data-qty-delta'), 10);
          adjustCart(pid, unit, delta);
          return;
        }

        // Quick-add promo button (+10 or complete promo)
        const quickBtn = target.closest('[data-quick-add]');
        if (quickBtn) {
          const pid = quickBtn.getAttribute('data-pid');
          const unit = quickBtn.getAttribute('data-unit');
          const amount = parseInt(quickBtn.getAttribute('data-quick-add'), 10);
          adjustCart(pid, unit, amount);
          return;
        }

        // Merchant: Stock toggle
        const stockToggle = target.closest('[data-toggle-stock]');
        if (stockToggle) {
          const pid = stockToggle.getAttribute('data-toggle-stock');
          const prod = state.products.find((p) => p.id === pid);
          if (prod) {
            prod.inStock = !prod.inStock;
            if (!prod.inStock && state.cart[pid]) {
              delete state.cart[pid];
            }
            persistState();
            render();
            showToast(
              prod.inStock ? `تم تفعيل "${prod.name}" كمتاح في الكتالوج ✓` : `تم تحويل "${prod.name}" إلى خلصان`,
              prod.inStock ? 'success' : 'warning'
            );
          }
          return;
        }

        // Merchant: Clearance toggle
        const clearanceToggle = target.closest('[data-toggle-clearance]');
        if (clearanceToggle) {
          const pid = clearanceToggle.getAttribute('data-toggle-clearance');
          const prod = state.products.find((p) => p.id === pid);
          if (prod) {
            prod.isClearance = !prod.isClearance;
            if (prod.isClearance && !prod.originalCartonPrice) {
              // Suggest an original price reference ~10% higher if not already set
              prod.originalCartonPrice = Math.round(prod.cartonPrice * 1.1);
            }
            persistState();
            render();
            showToast(
              prod.isClearance
                ? `🔥 تم تثبيت "${prod.name}" في أعلى الكتالوج كـ حرق سعر`
                : `تم إلغاء وضع حرق السعر عن "${prod.name}"`,
              prod.isClearance ? 'warning' : 'info'
            );
          }
          return;
        }

        // Merchant: Picking filter toggle
        const pickFilterBtn = target.closest('[data-picking-filter]');
        if (pickFilterBtn) {
          state.pickingFilter = pickFilterBtn.getAttribute('data-picking-filter');
          render();
          return;
        }

        // Merchant: Order accordion toggle
        const orderToggle = target.closest('[data-toggle-order]');
        if (orderToggle) {
          const oid = orderToggle.getAttribute('data-toggle-order');
          state.expandedOrders[oid] = !state.expandedOrders[oid];
          render();
          return;
        }

        // Merchant: Mark order dispatched / pending
        const dispatchBtn = target.closest('[data-dispatch-order]');
        if (dispatchBtn) {
          const oid = dispatchBtn.getAttribute('data-dispatch-order');
          const order = state.orders.find((o) => o.id === oid);
          if (order) {
            order.status = order.status === 'dispatched' ? 'pending' : 'dispatched';
            persistState();
            render();
            showToast(
              order.status === 'dispatched'
                ? `تم تحديث أوردر #${order.number} (${order.shopName}) إلى: خرج للتوصيل ✓`
                : `تم إرجاع أوردر #${order.number} لقائمة قيد التحميل`,
              order.status === 'dispatched' ? 'success' : 'info'
            );
          }
          return;
        }
      });

      // Delegated inline price editing & picking checkboxes
      document.getElementById('app-main').addEventListener('input', (e) => {
        const priceInput = e.target.closest('[data-price-input]');
        if (priceInput) {
          const pid = priceInput.getAttribute('data-pid');
          const field = priceInput.getAttribute('data-price-input'); // 'carton' | 'packet'
          const prod = state.products.find((p) => p.id === pid);
          if (!prod) return;

          if (!state.pendingPriceEdits[pid]) state.pendingPriceEdits[pid] = {};
          const rawVal = priceInput.value;

          if (field === 'carton') {
            state.pendingPriceEdits[pid].cartonPrice = rawVal;
            // Live update unit cost text without re-rendering input
            const num = parseFloat(rawVal);
            if (num > 0 && prod.unitsPerCarton) {
              const unitEl = document.getElementById(`live-unit-cost-${pid}`);
              if (unitEl) unitEl.textContent = `${formatMoney(+(num / prod.unitsPerCarton).toFixed(2))} ج`;
            }
          } else {
            state.pendingPriceEdits[pid].packetPrice = rawVal;
          }

          // Clean up entry if values match original
          const edit = state.pendingPriceEdits[pid];
          const cartonUnchanged =
            edit.cartonPrice === undefined || String(edit.cartonPrice) === String(prod.cartonPrice);
          const packetUnchanged =
            edit.packetPrice === undefined ||
            String(edit.packetPrice) === String(prod.packetPrice == null ? '' : prod.packetPrice);

          if (cartonUnchanged && packetUnchanged) {
            delete state.pendingPriceEdits[pid];
            priceInput.classList.remove('border-amber-400', 'bg-amber-50/40');
            priceInput.classList.add('border-slate-200', 'bg-slate-50');
          } else {
            priceInput.classList.remove('border-slate-200', 'bg-slate-50');
            priceInput.classList.add('border-amber-400', 'bg-amber-50/40');
          }

          updateFloatingSaveBar();
        }
      });

      document.getElementById('app-main').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.closest('[data-price-input]')) {
          if (Object.keys(state.pendingPriceEdits).length > 0) {
            e.preventDefault();
            document.getElementById('btn-save-prices').click();
          }
        }
      });

      document.getElementById('app-main').addEventListener('change', (e) => {
        const check = e.target.closest('[data-picking-check]');
        if (check) {
          const key = check.getAttribute('data-picking-check');
          state.pickingChecked[key] = check.checked;
          persistState();
          render();
        }
      });

      function adjustCart(pid, unit, delta) {
        const prod = state.products.find((p) => p.id === pid);
        if (!prod || !prod.inStock) return;

        if (!state.cart[pid]) state.cart[pid] = { cartons: 0, packets: 0 };
        const field = unit === 'packet' ? 'packets' : 'cartons';
        const prevBonus = calcBonusCartons(prod, state.cart[pid].cartons);

        state.cart[pid][field] = Math.max(0, (state.cart[pid][field] || 0) + delta);
        if (state.cart[pid].cartons === 0 && state.cart[pid].packets === 0) {
          delete state.cart[pid];
        } else {
          const newBonus = calcBonusCartons(prod, state.cart[pid].cartons);
          if (newBonus > prevBonus) {
            showToast(`🎁 مبروك! كسبت +${newBonus} كرتونة هدية على ${prod.name.split('(')[0].trim()}`, 'success');
          }
        }

        render();
      }

      // =========================================================================
      // GLOBAL STATIC BUTTON LISTENERS
      // =========================================================================
      document.getElementById('role-customer').addEventListener('click', () => {
        state.role = 'customer';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('role-merchant').addEventListener('click', () => {
        state.role = 'merchant';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('btn-reset-demo').addEventListener('click', openResetConfirmModal);

      document.getElementById('btn-open-checkout').addEventListener('click', openCheckoutDrawer);

      document.getElementById('btn-discard-prices').addEventListener('click', () => {
        state.pendingPriceEdits = {};
        render();
        showToast('تم إلغاء تعديلات الأسعار غير المحفوظة', 'info');
      });

      document.getElementById('btn-save-prices').addEventListener('click', () => {
        let updatedCount = 0;
        Object.entries(state.pendingPriceEdits).forEach(([pid, edit]) => {
          const prod = state.products.find((p) => p.id === pid);
          if (!prod) return;

          if (edit.cartonPrice !== undefined) {
            const val = parseFloat(edit.cartonPrice);
            if (val > 0) {
              if (prod.isClearance && val < prod.cartonPrice && !prod.originalCartonPrice) {
                prod.originalCartonPrice = prod.cartonPrice;
              }
              prod.cartonPrice = val;
              if (prod.unitsPerCarton > 0) {
                prod.unitCost = +(val / prod.unitsPerCarton).toFixed(2);
              }
              updatedCount += 1;
            }
          }
          if (edit.packetPrice !== undefined) {
            const raw = String(edit.packetPrice).trim();
            if (raw === '' || parseFloat(raw) <= 0) {
              prod.packetPrice = null;
            } else {
              prod.packetPrice = parseFloat(raw);
            }
            if (edit.cartonPrice === undefined) updatedCount += 1;
          }
        });

        state.pendingPriceEdits = {};
        persistState();
        render();
        showToast(`تم حفظ الأسعار وتحديث كتالوج العملاء لحظياً (${updatedCount} ${updatedCount === 1 ? 'صنف' : 'أصناف'}) ✓`);
      });

      // Escape key closes modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const root = document.getElementById('modal-root');
          if (!root.classList.contains('hidden')) closeModal();
        }
      });

      // Initial Boot
      render();
    })();
  </script>
</body>
</html>
